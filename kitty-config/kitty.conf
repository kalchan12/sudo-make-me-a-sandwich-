# ==============================================================================
# KITTY CONFIGURATION - HACKER EDITION (MODULAR)
# ==============================================================================
# Theme is modularly included below. To switch themes:
#   run 'kitty-theme' in your terminal or edit the include line below.
# Reload config anytime inside Kitty with: Ctrl+Shift+F5
# ==============================================================================

# --- MODULAR THEME IMPORT ---
include themes/active-theme.conf

# --- FONTS ---
font_family      Fira Code
bold_font        auto
italic_font      auto
bold_italic_font auto
font_size        11.5

# Advanced font ligature settings (arrows, !=, ==, >=, etc.)
disable_ligatures never

# --- CURSOR ---
cursor_shape          beam
cursor_beam_thickness 1.8
cursor_blink_interval 0.5
cursor_stop_blinking_after 15.0

# --- WINDOW & PADDING ---
window_padding_width  10 14
placement_strategy    center
hide_window_decorations no
remember_window_size  yes
initial_window_width  1000
initial_window_height 650

# --- BACKGROUND OPACITY & BLUR ---
# Gives that translucent cyber HUD aesthetic
background_opacity         0.93
background_blur            1
dynamic_background_opacity yes

# --- SCROLLBACK & PERFORMANCE ---
scrollback_lines 10000
wheel_scroll_multiplier 3.0
touch_scroll_multiplier 2.0
repaint_delay    10
input_delay      3
sync_to_monitor  yes

# --- BELL ---
enable_audio_bell no
visual_bell_duration 0.0
window_alert_on_bell yes
bell_on_tab "🔔 "

# --- MOUSE & URLS ---
mouse_hide_wait 3.0
detect_urls yes
url_style curly
open_url_with default
copy_on_select yes
strip_trailing_spaces smart

# --- TAB BAR (POWERLINE STYLE) ---
tab_bar_edge top
tab_bar_style powerline
tab_powerline_style slanted
tab_title_template "{index}: {title}"
active_tab_font_style bold

# --- SHELL INTEGRATION ---
shell /bin/zsh
close_on_child_death no
allow_remote_control yes

# --- KEYBINDINGS ---
# Config reload
map ctrl+shift+f5 load_config_file
map ctrl+shift+f6 debug_config

# Font sizing
map ctrl+equal change_font_size all +1.0
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Opacity toggles on the fly
map ctrl+shift+a>m set_background_opacity +0.05
map ctrl+shift+a>l set_background_opacity -0.05
map ctrl+shift+a>1 set_background_opacity 1
map ctrl+shift+a>d set_background_opacity default

# Clipboard
map ctrl+shift+c copy_to_clipboard
map ctrl+shift+v paste_from_clipboard

# Tab navigation
map ctrl+shift+t new_tab
map ctrl+shift+q close_tab
map ctrl+shift+right next_tab
map ctrl+shift+left previous_tab
map ctrl+shift+. move_tab_forward
map ctrl+shift+, move_tab_backward
